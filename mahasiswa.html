<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Array Mahasiswa</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html">Halim<span>Tech</span></a><nav><a href="kalkulator.html">Kalkulator</a><a class="active" href="mahasiswa.html">Array</a><a href="konversi.html">Konversi</a><a href="database.html">Data Mahasiswa</a></nav></header>
<main><a class="back" href="index.html">← Kembali ke beranda</a><div class="page-title"><p class="eyebrow">LATIHAN 02</p><h1>Array Mahasiswa</h1><p>Menampilkan lima data mahasiswa menggunakan array dan menghitung rata-rata nilai.</p></div>
<section class="panel"><h2>Daftar mahasiswa</h2><div class="table-wrap"><table><thead><tr><th>No</th><th>NIM</th><th>Nama</th><th>Nilai</th></tr></thead><tbody id="studentRows"></tbody></table></div><div class="summary"><div class="stat"><small>Jumlah mahasiswa</small><strong id="count"></strong></div><div class="stat"><small>Total nilai</small><strong id="total"></strong></div><div class="stat"><small>Rata-rata</small><strong id="average"></strong></div></div></section></main><footer>HalimTech · Latihan 02</footer>
<script>
const mahasiswa = [
  {nim:"2026001", nama:"Muhammad", nilai:90},
  {nim:"2026002", nama:"Andi", nilai:85},
  {nim:"2026003", nama:"Siti", nilai:78},
  {nim:"2026004", nama:"Budi", nilai:65},
  {nim:"2026005", nama:"Rina", nilai:82}
];
const tbody = document.getElementById("studentRows");
mahasiswa.forEach((m, index) => {
  const row = document.createElement("tr");
  [index + 1, m.nim, m.nama, m.nilai].forEach(value => {
    const cell = document.createElement("td"); cell.textContent = value; row.append(cell);
  });
  tbody.append(row);
});
const total = mahasiswa.reduce((sum, m) => sum + m.nilai, 0);
document.getElementById("count").textContent = mahasiswa.length;
document.getElementById("total").textContent = total;
document.getElementById("average").textContent = (total / mahasiswa.length).toFixed(2);
</script></body></html>
