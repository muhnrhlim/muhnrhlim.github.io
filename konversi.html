<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Konversi Nilai</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html">Halim<span>Tech</span></a><nav><a href="kalkulator.html">Kalkulator</a><a href="mahasiswa.html">Array</a><a class="active" href="konversi.html">Konversi</a><a href="database.html">Data Mahasiswa</a></nav></header>
<main><a class="back" href="index.html">← Kembali ke beranda</a><div class="page-title"><p class="eyebrow">LATIHAN 03</p><h1>Konversi Nilai</h1><p>Masukkan nilai bilangan bulat 0–100 untuk mendapatkan huruf mutu.</p></div>
<section class="panel"><form id="gradeForm"><div class="field"><label for="nilai">Nilai mahasiswa</label><input id="nilai" type="number" min="0" max="100" step="1" required placeholder="Contoh: 85"></div><button type="submit">Konversi nilai</button></form><div id="output" aria-live="polite"></div><h2 style="margin-top:28px">Ketentuan konversi</h2><table><tbody><tr><td>81–100</td><td>A</td></tr><tr><td>76–80</td><td>B</td></tr><tr><td>61–75</td><td>C</td></tr><tr><td>36–60</td><td>D</td></tr><tr><td>0–35</td><td>E</td></tr></tbody></table></section></main><footer>HalimTech · Latihan 03</footer>
<script>
function konversiNilai(nilai) {
  if (!Number.isInteger(nilai) || nilai < 0 || nilai > 100) return "Nilai tidak valid";
  if (nilai >= 81) return "A";
  if (nilai >= 76) return "B";
  if (nilai >= 61) return "C";
  if (nilai >= 36) return "D";
  return "E";
}
document.getElementById("gradeForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const raw = document.getElementById("nilai").value;
  const nilai = Number(raw);
  const output = document.getElementById("output");
  const grade = konversiNilai(nilai);
  output.className = "result" + (grade === "Nilai tidak valid" ? " error" : "");
  output.replaceChildren();
  const label = document.createElement("strong");
  label.textContent = grade === "Nilai tidak valid" ? grade : "Nilai " + nilai + " mendapatkan huruf mutu:";
  output.append(label);
  if (grade !== "Nilai tidak valid") { const value = document.createElement("div"); value.className = "big-result"; value.textContent = grade; output.append(value); }
});
</script></body></html>
