<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Halaman Interaktif</title>
    <style>
        h1 {
            color: #2965F1;
            font-size: 48px;
        }
        button {
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <h1>0</h1>
    <button>Tambah</button>

    <script>
        let n = 0;
        const h1 = document.querySelector("h1");

        document.querySelector("button").onclick = () => {
            n++;
            h1.textContent = n;
        };
    </script>
</body>
</html>
