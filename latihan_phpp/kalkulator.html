<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kalkulator</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html">Halim<span>Tech</span></a><nav><a class="active" href="kalkulator.html">Kalkulator</a><a href="mahasiswa.html">Array</a><a href="konversi.html">Konversi</a><a href="database.html">Data Mahasiswa</a></nav></header>
<main><a class="back" href="index.html">← Kembali ke beranda</a><div class="page-title"><p class="eyebrow">LATIHAN 01</p><h1>Kalkulator</h1><p>Masukkan dua angka dan pilih operator untuk menghitung hasilnya.</p></div>
<section class="panel"><form id="calcForm"><div class="field"><label for="angka1">Angka pertama</label><input type="number" step="any" id="angka1" required placeholder="Contoh: 10"></div><div class="field"><label for="operator">Operator</label><select id="operator" required><option value="">Pilih operator</option><option value="+">Penjumlahan (+)</option><option value="-">Pengurangan (-)</option><option value="*">Perkalian (*)</option><option value="/">Pembagian (/)</option></select></div><div class="field"><label for="angka2">Angka kedua</label><input type="number" step="any" id="angka2" required placeholder="Contoh: 5"></div><button type="submit">Hitung sekarang</button></form><div id="output" aria-live="polite"></div></section></main><footer>HalimTech · Latihan 01</footer>
<script>
document.getElementById("calcForm").addEventListener("submit", function(event) {
  event.preventDefault();
  const a = Number(document.getElementById("angka1").value);
  const b = Number(document.getElementById("angka2").value);
  const operator = document.getElementById("operator").value;
  let hasil;
  if (!Number.isFinite(a) || !Number.isFinite(b) || !operator) return tampil("Periksa kembali input angka dan operator.", true);
  switch (operator) {
    case "+": hasil = a + b; break;
    case "-": hasil = a - b; break;
    case "*": hasil = a * b; break;
    case "/":
      if (b === 0) return tampil("Error: tidak bisa membagi dengan nol.", true);
      hasil = a / b; break;
    default: return tampil("Operator tidak valid.", true);
  }
  tampil("Hasil perhitungan", false, String(hasil));
});
function tampil(pesan, error, angka) {
  const el = document.getElementById("output");
  el.className = "result" + (error ? " error" : "");
  el.replaceChildren();
  const label = document.createElement("strong"); label.textContent = pesan; el.append(label);
  if (angka !== undefined) { const value = document.createElement("div"); value.className = "big-result"; value.textContent = angka; el.append(value); }
}
</script></body></html>
